name: 每日早报抓取

on:
  schedule:
    # 每天 UTC 22:00 运行（北京时间早上 6:00）
    - cron: '0 22 * * *'
  workflow_dispatch:  # 允许手动点击触发

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 请求 60s 接口并保存
        run: |
          DATE=$(date -d "tomorrow" +%Y-%m-%d)
          curl -s "https://60s.viki.moe/v2/60s" -o "static/60s/$DATE.json"

      - name: 提交变更
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "更新 $DATE 早报" || exit 0
          git push
