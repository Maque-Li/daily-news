name: Fetch daily 60s news

on:
  schedule:
    # 通常北京时间 07:10 左右发布，预留约 17 分钟同步缓冲。
    # GitHub Actions 使用 UTC：前一天 23:27 = 北京时间次日 07:27。
    - cron: '27 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-60s-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check output directory
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d static/60s ]; then
            echo "static/60s 不存在，创建目录"
            mkdir -p static/60s
          fi

      - name: Fetch and validate news
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          today="$(TZ=Asia/Shanghai date +%F)"
          sources=(
            'https://60s.viki.moe/v2/60s'
            "https://60s-static.viki.moe/60s/$today.json"
            "https://cdn.jsdelivr.net/gh/vikiboss/60s-static-host@main/static/60s/$today.json"
          )
          fetched=false
          for source in "${sources[@]}"; do
            echo "尝试数据源：$source"
            # 默认仅重试临时故障；403 直接切换数据源。
            if ! curl --fail --silent --show-error --location \
              --retry 2 --retry-delay 5 \
              --connect-timeout 15 --max-time 45 \
              "$source" -o "$response"; then
              echo "::warning::请求失败，尝试下一个数据源"
              continue
            fi

            # 校验成功状态、非空新闻和北京时间当天日期。
            if ! jq -e --arg today "$today" '
              type == "object" and
              (.code == null or .code == 200) and
              ((.data // .) | (
                .date == $today and
                (.news | type == "array") and
                (.news | length > 0)
              ))
            ' "$response" > /dev/null; then
              echo "::warning::数据格式无效或不是当天新闻，尝试下一个数据源"
              continue
            fi
            fetched=true
            break
          done

          if [ "$fetched" != true ]; then
            echo "::error::所有数据源均不可用或当天新闻尚未更新，保留已有文件。"
            exit 1
          fi

          # 静态源返回裸数据，补齐 API 包装，保持消费者的 .data 访问方式。
          jq --sort-keys '
            if .data != null then .
            else {code: 200, message: "获取成功", data: .}
            end
          ' "$response" > "static/60s/$today.json"
          cp "static/60s/$today.json" static/60s/latest.json

      - name: Commit and push updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- static/60s/
          if git diff --cached --quiet; then
            echo "新闻内容没有变化，无需提交"
            exit 0
          fi
          git commit -m "chore: update daily 60s news"
          git push
