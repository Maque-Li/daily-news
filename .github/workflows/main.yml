name: Fetch daily 60s news

on:
  schedule:
    # 通常北京时间 07:10 左右发布，预留约 17 分钟同步缓冲。
    # GitHub Actions 使用 UTC：前一天 23:27 = 北京时间次日 07:27。
    - cron: '27 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-60s-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check output directory
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d static/60s ]; then
            echo "static/60s 不存在，创建目录"
            mkdir -p static/60s
          fi

      - name: Fetch and validate news
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT

          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 20 --retry-all-errors \
            --connect-timeout 15 --max-time 60 \
            'https://60s.viki.moe/v2/60s' -o "$response"

          # 兼容带 data 包装的响应；拒绝错误响应或空新闻。
          jq -e '
            type == "object" and
            (.code == null or .code == 200) and
            ((.data // .) | (
              (.date | type == "string") and
              (.date | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$")) and
              (.news | type == "array") and
              (.news | length > 0)
            ))
          ' "$response" > /dev/null

          news_date="$(jq -r '(.data // .).date' "$response")"
          today="$(TZ=Asia/Shanghai date +%F)"
          if [ "$news_date" != "$today" ]; then
            echo "::error::接口返回日期 $news_date，今天为 $today，停止写入以避免保存过期新闻。"
            exit 1
          fi

          # 保留完整接口响应；格式化并排序键，减少无意义的差异。
          jq --sort-keys . "$response" > "static/60s/$news_date.json"
          cp "static/60s/$news_date.json" static/60s/latest.json

      - name: Commit and push updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- static/60s/
          if git diff --cached --quiet; then
            echo "新闻内容没有变化，无需提交"
            exit 0
          fi
          git commit -m "chore: update daily 60s news"
          git push
