name: Fetch daily 60s news

on:
  schedule:
    # 北京时间 07:27 首次抓取，07:47、08:17、09:17、10:17、11:17 补抓。
    # 定时任务可能延迟；当天已成功保存则直接跳过。
    - cron: '27,47 23 * * *'
    - cron: '17 0-3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-60s-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check output directory
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d static/60s ]; then
            echo "static/60s 不存在，创建目录"
            mkdir -p static/60s
          fi

      - name: Check whether today is already saved
        id: freshness
        shell: bash
        run: |
          today="$(TZ=Asia/Shanghai date +%F)"
          if [ -f static/60s/latest.json ] && jq -e --arg today "$today" '(.data // .) | .date == $today and (.news | type == "array") and (.news | length > 0)' static/60s/latest.json > /dev/null; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch and validate news
        if: steps.freshness.outputs.fresh != 'true'
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          today="$(TZ=Asia/Shanghai date +%F)"
          curl --fail --silent --show-error --location \
            --retry 2 --retry-delay 5 --connect-timeout 15 --max-time 45 \
            'https://60s.viki.moe/v2/60s?encoding=json' -o "$response"

          if ! jq -e --arg today "$today" '
            type == "object" and .code == 200 and
            (.data | (.date == $today and
              (.news | type == "array") and (.news | length > 0)))
          ' "$response" > /dev/null; then
            echo "::error::响应格式无效或当天新闻尚未更新，保留已有文件，等待后续补抓。"
            exit 1
          fi
          jq --sort-keys '
            if .data != null then .
            else {code: 200, message: "获取成功", data: .} end
          ' "$response" > "static/60s/$today.json"
          cp "static/60s/$today.json" static/60s/latest.json

      - name: Commit and push updates
        if: steps.freshness.outputs.fresh != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- static/60s/
          if git diff --cached --quiet; then
            echo "新闻内容没有变化，无需提交"
            exit 0
          fi
          git commit -m "chore: update daily 60s news"
          git push
